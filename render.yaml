services:
  - type: web
    name: eventpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Keep application secrets and deployment-specific values in Render.
      # Render supplies PORT automatically; scripts/run_local.py maps it to
      # the attendee-facing RSVP server.
      - key: AGENT_MAILBOX
        value: "true"
      - key: RSVP_BASE_URL
        sync: false
      - key: COORDINATOR_SEED
        sync: false
      - key: SUPPLIER_SEED
        sync: false
      - key: OUTREACH_SEED
        sync: false
      - key: SUPPLIER_ADDRESS
        sync: false
      - key: OUTREACH_ADDRESS
        sync: false
      - key: RSVP_SIGNING_SECRET
        sync: false
